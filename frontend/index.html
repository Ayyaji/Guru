<!doctype html>
<html>
    <head>
        <meta charset="UTF-8" />
        <title>GURU</title>
        <style>
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }
            body {
                font-family: sans-serif;
                background-color: #0f0f0f;
                color: #e5e5e5;
                display: flex;
                flex-direction: column;
                height: 100vh;
            }
            h1 {
                font-size: 15px;
                font-weight: 500;
                padding: 14px 18px;
                background: #1a1a1a;
            }
            #chat-box {
                flex: 1;
                overflow-y: auto;
                padding: 20px 18px;
                display: flex;
                flex-direction: column;
                gap: 12px;

                max-width: 700px;
                margin: 0 auto;
                width: 100%;
            }

            .user-msg {
                align-self: flex-end;
                background: #2563eb;
                color: white;
                padding: 10px 14px;
                border-radius: 16px;
                border-bottom-right-radius: 4px;
                max-width: 70%;
                font-size: 14px;
                line-height: 1.6;
            }

            .guru-msg {
                align-self: flex-start;
                background: #1e1e1e;
                color: #e5e5e5;
                border: 0.5px solid #2a2a2a;
                padding: 10px 14px;
                border-radius: 16px;
                border-bottom-left-radius: 4px;
                max-width: 70%;
                font-size: 14px;
                line-height: 1.6;
            }

            #input-bar {
                display: flex;
                align-items: flex-end;
                gap: 8px;
                padding: 12px 14px;
                max-width: 700px;
                margin: 0 auto;
                width: 100%;

            }

            #user-input {
                flex: 1;
                min-height: 22px;
                max-height: 120px;
                background: #2a2a2a;
                border: 0.5px solid #3a3a3a;
                color: #e5e5e5;
                padding: 10px 14px;
                border-radius: 12px;
                resize: none;
                font-size: 14px;
                font-family: sans-serif;
                line-height: 1.5;
                outline: none;
            }

            #attach-btn {
                width: 36px;
                height: 36px;
                background: transparent;
                border: 0.5px solid #3a3a3a;
                border-radius: 50%;
                color: #aaa;
                cursor: pointer;
                font-size: 18px;
                display: flex;
                align-items: center;
                justify-content: center;
                flex-shrink: 0;
            }

            #send-btn {
                width: 36px;
                height: 36px;
                background: #2563eb;
                color: white;
                border: none;
                border-radius: 50%;
                cursor: pointer;
                font-size: 18px;
                display: flex;
                align-items: center;
                justify-content: center;
                flex-shrink: 0;
            }

            #send-btn:hover { background: #1d4ed8; }
            }
        </style>
    </head>
    <body>
        <h1>GURU</h1>
        <div id="chat-box"></div>
        <div id="input-bar">
            <input
                type="file"
                accept=".pdf"
                id="pdf-input"
                style="display: none"
            />
            <button id="attach-btn">📎</button>
            <textarea
                id="user-input"
                placeholder="Ask GURU anything…"
            ></textarea>
            <button id="send-btn">↑</button>
        </div>
        <script>
            const chatBox = document.getElementById("chat-box");
            const text = document.getElementById("user-input");
            const attachBtn = document.getElementById("attach-btn");
            const sendBtn = document.getElementById("send-btn");

            attachBtn.addEventListener("click", () => {
                document.getElementById("pdf-input").click();
            });
            sendBtn.addEventListener("click", sendMessage);
            document
                .getElementById("pdf-input")
                .addEventListener("change", uploadPdf);

            text.addEventListener("keydown", (e) => {
                if (e.key === "Enter" && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });

            async function sendMessage() {
                const userMessage = text.value.trim();
                if (!userMessage) return;
                text.value = "";
                const userdiv = document.createElement("div");
                userdiv.classList.add("user-msg");
                userdiv.textContent = userMessage;
                chatBox.appendChild(userdiv);
                const response = await fetch("http://localhost:8000/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ content: userMessage }),
                });
                const data = await response.json();
                const guruDiv = document.createElement("div");
                guruDiv.classList.add("guru-msg");
                guruDiv.textContent = data.response;
                chatBox.appendChild(guruDiv);
                chatBox.scrollTop = chatBox.scrollHeight;
            }

            async function uploadPdf() {
                const theFile = document.getElementById("pdf-input").files[0];
                if (!theFile) return;
                const formData = new FormData();
                formData.append("file", theFile);
                const response = await fetch(
                    "http://localhost:8000/upload-pdf",
                    {
                        method: "POST",
                        body: formData,
                    },
                );
                const data = await response.json();
                const guruDiv = document.createElement("div");
                guruDiv.classList.add("guru-msg");
                guruDiv.textContent = data.response;
                chatBox.appendChild(guruDiv);
            }
        </script>
    </body>
</html>
